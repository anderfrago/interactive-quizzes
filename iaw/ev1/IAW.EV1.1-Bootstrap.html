<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz: Bootstrap 5: maquetación responsive</title>
    <style>
        :root { --p: #10b981; --s: #64748b; --bg: #f8fafc; --txt: #1e293b; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--txt); display: flex; justify-content: center; padding: 20px; }
        #q-box { background: white; max-width: 800px; width: 100%; padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .progress { height: 8px; background: #e2e8f0; border-radius: 4px; margin: 1.5rem 0; overflow: hidden; }
        #bar { height: 100%; background: var(--p); width: 0%; transition: 0.4s ease; }
        .opt { display: block; width: 100%; padding: 1rem; margin: 0.7rem 0; border: 2px solid #f1f5f9; border-radius: 10px; text-align: left; cursor: pointer; background: #fff; font-size: 1rem; transition: 0.2s; }
        .opt:hover { border-color: var(--p); background: #f0fdf4; }
        .correct { background: #dcfce7 !important; border-color: #22c55e !important; color: #166534; font-weight: 600; }
        .wrong { background: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b; }
        #next { background: var(--p); color: white; border: none; padding: 1rem 2.5rem; border-radius: 8px; cursor: pointer; float: right; display: none; font-weight: 600; }
        #results { display: none; text-align: center; }
        .header-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .tag { background: #f1f5f9; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; color: var(--s); }
        * { box-sizing: border-box; }
        #q-box { display: flow-root; }
        .opt, #question { white-space: pre-wrap; overflow-wrap: anywhere; }
        .opt:disabled { cursor: default; opacity: 1; }
        button:focus-visible { outline: 3px solid #0f172a; outline-offset: 3px; }
        #feedback { line-height: 1.5; }
        @media (max-width: 600px) { body { padding: 8px; } #q-box { padding: 1.2rem; } .header-info { flex-wrap: wrap; gap: 0.6rem; } }
    </style>
</head>
<body>

<div id="q-box">
    <div id="quiz-area">
        <div class="header-info">
            <span class="tag">IAW - Evaluación 1 · Unidad 01</span>
            <span id="counter" style="color: var(--s); font-size: 0.85rem;"></span>
        </div>
        <h2 style="margin: 0 0 1.5rem 0; color: #064e3b;">Bootstrap 5: maquetación responsive</h2>
        <div class="progress"><div id="bar"></div></div>
        <h3 tabindex="-1" id="question" style="line-height: 1.4;"></h3>
        <div id="options"></div>
        <p id="feedback" role="status" aria-live="polite"></p>
        <button id="next" onclick="loadNext()">Siguiente</button>
    </div>

    <div id="results" tabindex="-1">
        <h2 style="color:var(--p)">Simulación Finalizada</h2>
        <div style="font-size: 4.5rem; margin: 1.5rem 0; font-weight: 800; color: #065f46;" id="score-val"></div>
        <p id="eval-msg" style="font-size: 1.1rem; color: var(--s); margin-bottom: 2rem;"></p>
        <button onclick="location.reload()" style="padding: 1rem 2.5rem; background: var(--p); color:white; border:none; border-radius:8px; cursor:pointer; font-weight: bold;">Reintentar Test</button>
    </div>
</div>

<script>
    const data = [
    {
        "q": "¿Qué ventaja aporta separar el CSS en un archivo externo?",
        "a": [
            "Ejecuta JavaScript antes del HTML",
            "Permite reutilizar estilos en varias páginas y aprovechar la caché",
            "Convierte el HTML en código de servidor",
            "Evita necesitar etiquetas HTML"
        ],
        "c": 1
    },
    {
        "q": "¿Qué etiqueta enlaza correctamente una hoja de estilos externa?",
        "a": [
            "\u003cscript src=\"style.css\">\u003c/script>",
            "\u003cstyle href=\"style.css\">",
            "\u003clink rel=\"stylesheet\" href=\"style.css\">",
            "\u003ccss src=\"style.css\">"
        ],
        "c": 2
    },
    {
        "q": "¿Qué significa integrar Bootstrap mediante una CDN?",
        "a": [
            "Cargar sus archivos desde una red de distribución de contenidos",
            "Copiar todas sus reglas dentro de cada etiqueta",
            "Ejecutar Bootstrap exclusivamente en el servidor",
            "Instalar una extensión obligatoria en el navegador"
        ],
        "c": 0
    },
    {
        "q": "¿Para qué sirve \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">?",
        "a": [
            "Para fijar todas las pantallas a 1200 píxeles",
            "Para aumentar la resolución de las imágenes",
            "Para crear las doce columnas",
            "Para ajustar el viewport al ancho del dispositivo y establecer la escala inicial"
        ],
        "c": 3
    },
    {
        "q": "¿Cuántas columnas tiene la rejilla de Bootstrap 5?",
        "a": [
            "10",
            "12",
            "16",
            "24"
        ],
        "c": 1
    },
    {
        "q": "¿Cuál es la estructura habitual para crear una rejilla?",
        "a": [
            "Columna → contenedor → fila",
            "Fila → contenedor → columna",
            "Contenedor → fila → columnas",
            "Contenedor → tarjeta → head"
        ],
        "c": 2
    },
    {
        "q": "¿Qué diferencia hay entre container y container-fluid?",
        "a": [
            "container ajusta su ancho máximo por breakpoint; container-fluid ocupa el 100% del ancho disponible",
            "container-fluid crea siempre tres columnas",
            "container solo puede contener texto",
            "Ambas clases tienen siempre el mismo ancho máximo"
        ],
        "c": 0
    },
    {
        "q": "¿Qué clase define una fila del sistema de rejilla?",
        "a": [
            "card",
            "container-fluid",
            "flex-column",
            "row"
        ],
        "c": 3
    },
    {
        "q": "Tres columnas col-4 en una misma fila ocupan, en total:",
        "a": [
            "La mitad de la fila",
            "Las 12 columnas de la rejilla",
            "Solo 4 columnas de la rejilla",
            "24 columnas de la rejilla"
        ],
        "c": 1
    },
    {
        "q": "Si una columna ocupa col-4, ¿qué clase completa el ancho de la fila con una segunda columna?",
        "a": [
            "col-4",
            "col-6",
            "col-8",
            "col-12"
        ],
        "c": 2
    },
    {
        "q": "¿Cómo se organiza una rejilla anidada dentro de una columna?",
        "a": [
            "Se introduce una nueva row y sus columnas dentro de esa columna",
            "Se sitúa la nueva row fuera del contenedor principal obligatoriamente",
            "Se sustituyen las columnas por etiquetas head",
            "Se asigna col-24 a la columna exterior"
        ],
        "c": 0
    },
    {
        "q": "Con col-12 col-md-6 col-lg-4, ¿cuántas tarjetas caben por fila a 500 px de viewport?",
        "a": [
            "Cuatro",
            "Tres",
            "Dos",
            "Una"
        ],
        "c": 3
    },
    {
        "q": "Con col-12 col-md-6 col-lg-4, ¿cuántas tarjetas caben por fila a 800 px de viewport?",
        "a": [
            "Una",
            "Dos",
            "Tres",
            "Seis"
        ],
        "c": 1
    },
    {
        "q": "Con col-12 col-md-6 col-lg-4, ¿cuántas tarjetas caben por fila a 1200 px de viewport?",
        "a": [
            "Una",
            "Dos",
            "Tres",
            "Cuatro"
        ],
        "c": 2
    },
    {
        "q": "En Bootstrap 5, ¿a partir de qué ancho se aplica col-md-6?",
        "a": [
            "768 px",
            "576 px",
            "992 px",
            "1200 px"
        ],
        "c": 0
    },
    {
        "q": "¿Qué utilidad limita una imagen al ancho de su contenedor y mantiene su proporción?",
        "a": [
            "vh-100",
            "text-center",
            "container",
            "img-fluid"
        ],
        "c": 3
    },
    {
        "q": "¿Qué establece la clase vh-100?",
        "a": [
            "Un ancho de 100 píxeles",
            "Una altura del 100% del viewport",
            "Una altura de 100 píxeles",
            "Un margen vertical de 100 píxeles"
        ],
        "c": 1
    },
    {
        "q": "En un contenedor d-flex flex-column, ¿qué permite flex-grow-1 en main?",
        "a": [
            "Fijar main a la esquina superior",
            "Ocultar el pie de página",
            "Que main crezca para ocupar el espacio libre disponible",
            "Crear automáticamente doce tarjetas"
        ],
        "c": 2
    },
    {
        "q": "¿Para qué sirve g-4 en una row?",
        "a": [
            "Para ajustar los gutters horizontales y verticales de la rejilla",
            "Para crear cuatro columnas obligatorias",
            "Para activar el breakpoint lg",
            "Para fijar una altura de cuatro píxeles"
        ],
        "c": 0
    },
    {
        "q": "¿Qué genera la expresión Emmet div.row>(div.col-12.col-md-6.col-lg-4>div.card)*3?",
        "a": [
            "Tres filas con una única columna fija",
            "Una tarjeta con tres imágenes",
            "Doce tarjetas dentro de una columna",
            "Una fila con tres columnas responsive, cada una con una tarjeta"
        ],
        "c": 3
    }
];

    let current = 0, score = 0, canClick = true;

    function render() {
        canClick = true;
        document.getElementById('feedback').textContent = '';
        const qData = data[current];
        document.getElementById('question').innerText = qData.q;
        document.getElementById('counter').innerText = `PREGUNTA ${current + 1} DE ${data.length}`;
        document.getElementById('bar').style.width = `${((current + 1) / data.length) * 100}%`;
        
        const optCont = document.getElementById('options');
        optCont.innerHTML = '';
        qData.a.forEach((txt, i) => {
            const b = document.createElement('button');
            b.className = 'opt';
            b.innerText = txt;
            b.onclick = () => check(i, b);
            optCont.appendChild(b);
        });

        document.getElementById('next').style.display = 'none';
    }

    function check(i, btn) {
        if (!canClick) return;
        canClick = false;
        const correct = data[current].c;
        const all = document.querySelectorAll('.opt');
        
        if (i === correct) {
            btn.classList.add('correct');
            score++;
        } else {
            btn.classList.add('wrong');
            all[correct].classList.add('correct');
        }
        all.forEach(option => { option.disabled = true; });
        document.getElementById('feedback').textContent = i === correct
            ? '¡Correcto!'
            : 'Respuesta incorrecta. La respuesta correcta es: ' + data[current].a[correct];
        document.getElementById('next').style.display = 'block';
        document.getElementById('next').focus();
        if(current === data.length - 1) document.getElementById('next').innerText = "Ver Mi Nota";
    }

    function loadNext() {
        if (canClick || current >= data.length) return;
        current++;
        if (current < data.length) { render(); document.getElementById('question').focus(); }
        else showFinal();
    }

    function showFinal() {
        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('results').style.display = 'block';
        document.getElementById('results').focus();
        document.getElementById('score-val').innerText = `${score} / ${data.length}`;
        const m = document.getElementById('eval-msg');
        if(score >= 18) m.innerText = "¡Excelente! Dominas los contenidos de esta unidad.";
        else if(score >= 14) m.innerText = "¡Buen trabajo! Tienes una buena base; repasa las preguntas que has fallado.";
        else m.innerText = "Repasa la rejilla, los breakpoints y las utilidades de maquetación.";
    }

    render();
</script>
</body>
</html>
